# Sure (https://github.com/we-promise/sure), a personal finance app, from its own compose.example.yml.
kit: 1
source:
  repo: we-promise/sure
  path: compose.example.yml
name: sure
title: Sure
interface:
  service: web
  port: 3000
generate:
  SECRET_KEY_BASE: { bytes: 64, encoding: hex }
  POSTGRES_PASSWORD: {}
secrets: [OPENAI_ACCESS_TOKEN]
limits:
  web: { memory: 1G }
  worker: { memory: 1G }
  db: { memory: 512M }
  redis: { memory: 256M }
