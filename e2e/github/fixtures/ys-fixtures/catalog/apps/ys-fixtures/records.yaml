kit: 2
source: {repo: ys-fixtures/records, path: compose.yaml, commit: f876adc96d8ce410c6896a1fc26b822714481c90}
name: records
interface: {service: app, port: 8080}
agentAccess:
  credential:
    binding: service
    inject: {location: header, name: X-API-Key}
  roles:
    reader: {title: Reader, routes: [list]}
    inspector: {title: Inspector, routes: [list, show]}
  routes:
    list:
      method: GET
      path: /items
      effect: read
    show:
      method: GET
      path: /items/{id}
      effect: read
      approval: ask
      pathParams: {id: uuid}
