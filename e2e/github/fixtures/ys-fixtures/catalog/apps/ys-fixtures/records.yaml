kit: 2
source: {repo: ys-fixtures/records, path: compose.yaml, commit: 45cc1205f720f67b4d69c2e8188a34c3aac5abd7}
name: records
interface: {service: app, port: 8080}
agentAccess:
  credential:
    binding: service
    inject: {location: header, name: X-API-Key}
  roles:
    reader: {title: Reader, routes: [list]}
    inspector: {title: Inspector, routes: [list, show]}
  routes:
    list:
      method: GET
      path: /items
      effect: read
      outputFields: [id, revision, title]
    show:
      method: GET
      path: /items/{id}
      effect: read
      approval: ask
      pathParams: {id: uuid}
      outputFields: [id, revision, title]
