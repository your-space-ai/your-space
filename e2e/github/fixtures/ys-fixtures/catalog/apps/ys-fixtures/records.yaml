kit: 2
source: {repo: ys-fixtures/records, path: compose.yaml, commit: b1f4251b4e5dfa7acd9f1cce1968fe5e6272d819}
name: records
interface: {service: app, port: 8080}
agentAccess:
  credential:
    binding: service
    inject: {location: header, name: X-API-Key}
  roles:
    reader: {title: Reader, routes: [list]}
    inspector: {title: Inspector, routes: [list, show]}
    editor: {title: Editor, routes: [list, show, create, edit]}
    remover: {title: Remover, routes: [remove]}
  routes:
    list:
      method: GET
      path: /items
      effect: read
    show:
      method: GET
      path: /items/{id}
      effect: read
      approval: ask
      pathParams: {id: uuid}
    create:
      method: POST
      path: /items
    edit:
      method: PATCH
      path: /items/{id}
      pathParams: {id: uuid}
    remove:
      method: DELETE
      path: /items/{id}
      pathParams: {id: uuid}
