# The kit of the fixture app whose file loads .env. Its env is the whole environment Your Space gives
# that service: a generated secret, values, and one the owner gives.
kit: 1
source: {repo: ys-fixtures/envfile, path: compose.yaml, commit: e7aa05e15f774f710aec146c3fb7ce7fa06b3d1a}
name: envfile
title: Settings File
interface: {service: web, port: 8080}
env:
  SESSION_SECRET: {generate: {bytes: 16}}
  MODE: production
  # The file's own environment sets it too, and wins, as it would over .env.
  GREETING: from-the-kit
  OWNER_NAME: {ask: true, secret: false}
limits:
  web: {memory: 64M, cpus: 0.5}
