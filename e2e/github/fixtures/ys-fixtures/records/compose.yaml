# Synthetic app used to verify credential injection, approvals, writes and results through the edge.
# It keeps its records in memory, starting from two fixed ones. Like many REST APIs it wraps its list
# and nests fields, lets a create choose its record ID and refuses a second create of it, and the agent
# gets its response unchanged.
services:
  app:
    image: node:26-slim
    ports: ["8080:8080"]
    volumes: ["records-data:/records"]
    command:
      - node
      - -e
      - |
        const http = require("node:http");
        const records = [
          { id: "3f8a2c1e-5b7d-4e9f-a1c3-6d2b8e4f7a90", revision: 1, title: "Morning walk", assignee: { firstName: "Sam" } },
          { id: "9c4e7b2a-1d3f-4a6e-b8c5-2f7a9d1e3b64", revision: 3, title: "Water the plants", assignee: { firstName: "Sam" } },
        ];
        http.createServer((req, res) => {
          const send = (status, data) => {
            res.writeHead(status, {"content-type":"application/json"});
            res.end(JSON.stringify(data));
          };
          // Its data model answers only the admin key, and its records only the record key (spec 017).
          if (req.url === "/meta/fields") {
            if (req.headers["x-api-key"] !== "local-fixture-admin-key") return send(401, {});
            return send(200, { data: { fields: ["title", "assignee"] } });
          }
          if (req.headers["x-api-key"] !== "local-fixture-key") return send(401, {});
          let text = "";
          req.on("data", (chunk) => (text += chunk));
          req.on("end", () => {
            let body = {};
            try { if (text) body = JSON.parse(text); } catch { return send(400, {}); }
            if (!body || typeof body !== "object" || Array.isArray(body)) return send(400, {});
            const index = records.findIndex((record) => req.url === "/items/" + record.id);
            if (req.url === "/items" && req.method === "GET") return send(200, { data: { items: records }, totalCount: records.length });
            if (req.url === "/items" && req.method === "POST") {
              const id = body.id ?? require("node:crypto").randomUUID();
              if (records.some((record) => record.id === id)) return send(400, { error: "duplicate id" });
              const row = { ...body, id, revision: 1 };
              records.push(row);
              return send(201, { data: { createItem: row } });
            }
            if (index < 0) return send(404, {});
            if (req.method === "GET") return send(200, records[index]);
            if (req.method === "PATCH") {
              records[index] = { ...records[index], ...body, id: records[index].id, revision: records[index].revision + 1 };
              return send(200, { data: { updateItem: records[index] } });
            }
            if (req.method === "DELETE") {
              records.splice(index, 1);
              res.writeHead(204);
              return res.end();
            }
            return send(405, {});
          });
        }).listen(8080);
volumes:
  records-data: {}
