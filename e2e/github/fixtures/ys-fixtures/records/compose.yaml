# Synthetic app used to verify credential injection, approvals and results through the edge.
# Agents only read (decision 2026-11-23, Alpha scope), so it serves two fixed records. Like many
# REST APIs it wraps its list and nests fields, and the agent gets its response unchanged.
services:
  app:
    image: node:26-slim
    ports: ["8080:8080"]
    volumes: ["records-data:/records"]
    command:
      - node
      - -e
      - |
        const http = require("node:http");
        const records = [
          { id: "3f8a2c1e-5b7d-4e9f-a1c3-6d2b8e4f7a90", revision: 1, title: "Morning walk", assignee: { firstName: "Sam" } },
          { id: "9c4e7b2a-1d3f-4a6e-b8c5-2f7a9d1e3b64", revision: 3, title: "Water the plants", assignee: { firstName: "Sam" } },
        ];
        http.createServer((req, res) => {
          const send = (status, data) => {
            res.writeHead(status, {"content-type":"application/json"});
            res.end(JSON.stringify(data));
          };
          if (req.headers["x-api-key"] !== "local-fixture-key") return send(401, {});
          if (req.method !== "GET") return send(405, {});
          if (req.url === "/items") return send(200, { data: { items: records }, totalCount: records.length });
          const row = records.find((record) => req.url === "/items/" + record.id);
          return row ? send(200, row) : send(404, {});
        }).listen(8080);
volumes:
  records-data: {}
