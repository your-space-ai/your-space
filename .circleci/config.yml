version: 2.1

# The browser tests on x86_64, which upload the story screenshots to Argos, and the checks on Linux
# on Arm (aarch64), the other architecture Your Space ships for. GitHub Actions runs the typecheck,
# server tests and build, and the Compose setups checks.

commands:
  node26:
    description: Install the latest Node 26 from nodejs.org and put it first on the PATH.
    parameters:
      arch:
        type: enum
        enum: [x64, arm64]
    steps:
      - run:
          # The Arm machine image has no nvm, and the x86 one's default Node may not be 26, so both
          # jobs install it this way.
          name: Node 26
          command: |
            base=https://nodejs.org/dist/latest-v26.x
            cd /tmp
            curl -fsSLO "$base/SHASUMS256.txt"
            file=$(grep -o 'node-v26[^ ]*-linux-<< parameters.arch >>\.tar\.xz' SHASUMS256.txt)
            curl -fsSLO "$base/$file"
            grep " $file\$" SHASUMS256.txt | sha256sum -c -
            sudo mkdir -p /opt/node26
            sudo tar -xJf "$file" -C /opt/node26 --strip-components=1
            echo 'export PATH=/opt/node26/bin:$PATH' >> "$BASH_ENV"
            /opt/node26/bin/node --version

  browser-test-hosts:
    description: Resolve the workspace, app and CLI test domains on the local machine.
    steps:
      - run:
          # Node, and so Playwright's API requests, resolve names through the system, which doesn't
          # know *.localhost; browsers resolve those names themselves (RFC 6761).
          name: Test names on this machine
          # space.example.com is the CLI test's own domain, served with a certificate from Pebble.
          command: echo "127.0.0.1 space.localhost app.space.localhost whoami.space.localhost probe.space.localhost space.example.com" | sudo tee -a /etc/hosts

  failed-journeys:
    description: >-
      Keeps what explains a failed browser journey: its screenshot at the failure, the page's
      accessibility snapshot and its Playwright trace. Passing journeys keep nothing.
    steps:
      - run:
          # Only the failed tests' files, which hold the test stack's synthetic data. No HTML report,
          # videos or other test results.
          name: Failed journeys
          when: on_fail
          command: |
            mkdir -p /tmp/failed-journeys
            [ -d e2e/test-results ] || exit 0
            cd e2e/test-results
            find . \( -name 'test-failed-*.png' -o -name error-context.md -o -name trace.zip \) \
              -exec cp --parents {} /tmp/failed-journeys/ \;
      - store_artifacts:
          path: /tmp/failed-journeys
          destination: failed-journeys

  ready-pull-request:
    description: >-
      Stops the job early on a draft pull request. Marking a draft ready starts a new pipeline,
      through the GitHub App pipeline's "PR marked ready for review" trigger.
    steps:
      - run:
          # GitHub supplies draft status. Public pull requests can be read anonymously.
          name: Ready pull request
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request: running."
              exit 0
            fi
            if [[ ! $CIRCLE_PULL_REQUEST =~ ^https://github[.]com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/pull/([0-9]+)$ ]]; then
              echo "Unexpected GitHub pull request URL." >&2
              exit 1
            fi
            api="https://api.github.com/repos/${BASH_REMATCH[1]}/pulls/${BASH_REMATCH[2]}"
            headers=(-H "Accept: application/vnd.github+json")
            if [[ -n ${GITHUB_PR_READ_TOKEN:-} ]]; then
              headers+=(-H "Authorization: Bearer $GITHUB_PR_READ_TOKEN")
            fi
            pr=$(curl -fsS "${headers[@]}" "$api")
            if [ "$(echo "$pr" | jq -r .draft)" = true ]; then
              echo "It's a draft, so this job waits until it is marked ready for review."
              circleci-agent step halt
            fi

jobs:
  check-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - ready-pull-request
      - checkout
      - run:
          name: PostgreSQL 18
          command: |
            uname -m
            docker run -d --name pg -p 127.0.0.1:5432:5432 \
              -e POSTGRES_USER=yourspace -e POSTGRES_PASSWORD=yourspace -e POSTGRES_DB=yourspace postgres:18
            until docker exec pg pg_isready -U yourspace; do sleep 1; done
      - run:
          name: npm ci, typecheck, the tests, and the CLI's ARM executable on Node 26
          command: |
            docker run --rm --network host -v "$PWD":/repo -w /repo -e CI=true \
              -e TEST_DATABASE_URL=postgres://yourspace:yourspace@127.0.0.1:5432/yourspace \
              node:26-slim sh -c 'npm ci && npm run typecheck && npm test && npm run build --workspace cli && cli/scripts/executable.sh arm64 && cli/dist/your-space-linux-arm64 --version'

  e2e:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      # This job's screenshots are the ones Argos compares. ARGOS_TOKEN is set in the project
      # settings.
      YS_ARGOS_UPLOAD: "1"
    steps:
      - ready-pull-request
      - checkout
      - run:
          # A pull request runs the journeys in Chromium, whose screenshots Argos compares; main runs
          # them in Firefox and WebKit too, so a bug only those browsers show turns up after the
          # merge.
          name: Browsers
          command: |
            echo 'export YS_E2E_BROWSERS=webkit' >> "$BASH_ENV"
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                # Code that already passed this job in the same browsers doesn't run the journeys
                # again, such as a pull request rebased onto main after the one below it merged, or
                # given a new sign-off. The key is the commit's tree, so a change to any file runs
                # them; main always runs them.
                name: Same code as an earlier pass
                command: |
                  tree=$(git rev-parse 'HEAD^{tree}')
                  echo "$CIRCLE_JOB $tree $YS_E2E_BROWSERS" | tee /tmp/e2e-pass-key
            - restore_cache:
                keys:
                  - e2e-pass-v1-{{ checksum "/tmp/e2e-pass-key" }}
            - run:
                # A skipped run uploads nothing to Argos, so this commit gets no Argos check. The
                # earlier run's build has the same screenshots, compared with main as it was then.
                name: Skip if it passed
                command: |
                  if [ -f /tmp/e2e-pass/passed ]; then
                    echo "This code passed in $(cat /tmp/e2e-pass/passed), so the journeys don't run again and Argos gets no new build."
                    circleci-agent step halt
                  fi
      - run:
          # A change to documents alone can't change a screenshot, so it doesn't use Argos's limited
          # allowance. main compares its last commit; a pull request, everything since main.
          name: Argos upload
          command: |
            echo 'export YS_ARGOS_UPLOAD=0' >> "$BASH_ENV"
            exit 0
            if [ -z "${ARGOS_TOKEN:-}" ]; then
              echo "Skipping external visual comparisons because there is no Argos token."
              echo 'export YS_ARGOS_UPLOAD=0' >> "$BASH_ENV"
              exit 0
            fi
            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              git fetch -q origin main && range=origin/main...HEAD
            else
              range=HEAD^..HEAD
            fi
            if git diff --name-only "$range" | grep -qvE '^(docs/|specs/|\.specify/)|\.md$'; then
              echo "Uploading the screenshots to Argos."
            else
              echo "Only documents changed, so the screenshots aren't uploaded to Argos."
              echo 'export YS_ARGOS_UPLOAD=0' >> "$BASH_ENV"
            fi
      - node26:
          arch: x64
      - run: npm ci
      - browser-test-hosts
      - run:
          # The CLI's browser test runs the standalone executable, as people get it.
          name: The CLI's executable
          command: |
            npm run build --workspace cli
            cli/scripts/executable.sh x64
            echo "export YS_E2E_CLI=$PWD/cli/dist/your-space-linux-x64" >> "$BASH_ENV"
      - run:
          name: Install the browsers
          # A package mirror that doesn't answer can hold this step for half an hour, so it stops
          # after 10 minutes.
          command: timeout 10m npx playwright install --with-deps $YS_E2E_BROWSERS
          working_directory: e2e
      - run:
          # Builds the images, then runs the journeys against deploy/compose.yaml in the browsers
          # above.
          name: Browser journeys
          command: |
            projects=()
            for browser in ${YS_E2E_BROWSERS:?}; do
              projects+=("--project=$browser")
            done
            # A single Playwright worker runs the selected browsers in sequence.
            budget_minutes=$((30 * ${#projects[@]}))
            timeout 80m npx playwright test tests/appearance.spec.ts --project=webkit --repeat-each 30 --max-failures 3 --trace off
          working_directory: e2e
      - run:
          name: Stack status
          when: on_fail
          command: |
            docker version --format 'Docker Engine {{.Server.Version}}'
            docker compose -p ys-e2e --env-file e2e/stack.env -f deploy/compose.yaml \
              -f deploy/compose.build.yaml -f e2e/compose.e2e.yaml ps --all
      - failed-journeys
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Remember this pass
                command: |
                  mkdir -p /tmp/e2e-pass
                  echo "$CIRCLE_BUILD_URL (commit $CIRCLE_SHA1)" > /tmp/e2e-pass/passed
            - save_cache:
                key: e2e-pass-v1-{{ checksum "/tmp/e2e-pass-key" }}
                paths:
                  - /tmp/e2e-pass

  e2e-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - node26:
          arch: arm64
      - run: npm ci
      - browser-test-hosts
      - run:
          name: Chromium
          # A package mirror that doesn't answer can hold this step for half an hour, so it stops
          # after 10 minutes.
          command: timeout 10m npx playwright install --with-deps chromium
          working_directory: e2e
      - run:
          # Builds the images for Arm, then runs the journeys against deploy/compose.yaml.
          name: Browser journeys in Chromium on Arm
          command: npx playwright test --project chromium
          working_directory: e2e
          no_output_timeout: 30m
      - failed-journeys

parameters:
  arm-e2e:
    type: boolean
    default: false
    description: Run the Arm browser tests on a branch other than main.

workflows:
  # Every pull request and every push to main; the job stops early on drafts and on code that
  # already passed it.
  e2e:
    jobs:
      - e2e
  # The Arm browser tests are slow, so they run after a merge to main rather than on every pull
  # request. Start them on a branch by triggering a pipeline with arm-e2e set to true.
  arm64-e2e:
    when:
      or:
        - equal: [main, << pipeline.git.branch >>]
        - << pipeline.parameters.arm-e2e >>
    jobs:
      - e2e-arm64
