# Image-scan findings we accept instead of fixing, each with the reason and a date to look again.
# Container security (container-security.yml) refuses an entry without a statement or an
# expired_at, or one that has expired: Trivy would otherwise report it again without saying why.
# The scan's full inventory still lists every accepted finding, as suppressed, with its fixed
# version if one exists.
#
# Accept only what govulncheck or an upstream policy shows we don't need to fix. Trivy reports a Go
# binary by module version alone; `govulncheck -mode=binary` checks the code the binary can reach.
# Before renewing an entry, run it again on the binary from the current upstream image. Keep each
# entry to the binary's path, so the same finding anywhere else is still reported.
vulnerabilities:
  # gosu, in the official postgres image, is built with Go 1.24.6 on purpose: its maintainers rebuild
  # only for vulnerabilities gosu can reach (https://github.com/tianon/gosu/blob/master/SECURITY.md).
  # govulncheck on gosu 1.20 from postgres:18: "Your code is affected by 0 vulnerabilities."
  - id: CVE-2025-61726
    paths: [usr/local/bin/gosu]
    statement: Go standard library code gosu never calls (govulncheck).
    expired_at: 2027-05-23
