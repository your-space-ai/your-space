name: Container security

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [server, runtime, web, postgres]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the image used by the workspace
        id: image
        run: |
          if [[ $COMPONENT == postgres ]]; then
            image=$(docker compose -f deploy/stack.yaml config --format json | jq -er .services.postgres.image)
            docker pull "$image"
          else
            image="local/$COMPONENT:scan"
            docker build --pull -f "$COMPONENT/Dockerfile" -t "$image" .
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Scan installed OS packages and bundled libraries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.image.outputs.name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: container.sarif
      - name: Report findings to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: container.sarif
          category: container-${{ matrix.component }}
