name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.base.outputs.code == 'true' }}
      setups: ${{ steps.changes.outputs.ci_or_docs != 'true' && (github.event_name != 'pull_request' || (steps.base.outputs.code == 'true' && (!github.event.repository.private || steps.base.outputs.bottom == 'true'))) }}
      browser: ${{ github.event_name == 'workflow_dispatch' || (steps.changes.outputs.ci_or_docs != 'true' && !github.event.repository.private && (github.event_name == 'push' || steps.base.outputs.code == 'true')) }}
    steps:
      - name: Check the branch for a manual run
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Select main to run the full CI checks." >&2
          exit 1
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          # A pull request's changes since its base, or the commits a push added to main.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A change to CI configuration or documentation alone leaves the code the Compose setups and
          # browser journeys test as it was, so they're skipped. A push with no previous commit to
          # compare, or one git can't find, runs them.
          if [[ ! $BEFORE =~ ^0*$ ]] &&
            git diff --quiet "$BEFORE...$AFTER" -- . ':!.github/' ':!.circleci/' ':!*.md' ':!docs/' ':!specs/' ':!.specify/'; then
            echo "Only CI configuration or documentation changed: the Compose setups and browser journeys are skipped."
            echo 'ci_or_docs=true' >> "$GITHUB_OUTPUT"
          fi
      - id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MAIN: ${{ github.event.repository.default_branch }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)
          if [[ $base == "$MAIN" ]]; then echo 'bottom=true' >> "$GITHUB_OUTPUT"; fi
          # Documentation-only PRs still report a required check and verify every sign-off.
          if git diff --quiet "$BASE...$HEAD" -- . ':!*.md' ':!docs/' ':!specs/' ':!.specify/'; then
            echo 'code=false' >> "$GITHUB_OUTPUT"
          else
            test "$?" = 1
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list --reverse "$BASE..$HEAD")
          test -n "$commits"
          while IFS= read -r sha; do
            author=$(git show -s --format='%an <%ae>' "$sha")
            trailers=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$sha")
            if [[ $author == *'<'*'@'*'>' ]] && grep -Fxiq -- "$author" <<< "$trailers"; then continue; fi

            # A verified signature by the same account, plus visible organization membership,
            # proves the member exception. A private membership can always use git commit -s.
            signer=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f oid="$sha" \
              -f query='query($owner:String!,$name:String!,$oid:GitObjectID!){repository(owner:$owner,name:$name){object(oid:$oid){... on Commit{author{user{login}} signature{isValid signer{login}}}}}}' \
              --jq '.data.repository.object | select(.signature.isValid and .signature.signer.login != null and .signature.signer.login == .author.user.login) | .signature.signer.login')
            if [[ -n $signer ]] && gh api --silent "orgs/${GITHUB_REPOSITORY%/*}/public_members/$signer" 2>/dev/null; then continue; fi

            echo "Commit $sha needs a Signed-off-by trailer matching its author. See CONTRIBUTING.md." >&2
            exit 1
          done <<< "$commits"

  dependencies:
    # A visible signal, not part of Contribution checks: a maintainer can still merge a PR whose
    # new dependency has an advisory, after deciding the risk is acceptable.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  migrations:
    # Migrations on main stay as merged, and a new one comes after every earlier one (spec 016,
    # decision 8). A pull request is compared with main as it is when this runs, not the base its
    # event names, so a stacked or re-run pull request is checked against what it would merge into.
    # On main, each push is compared with the commit before it, as an alarm.
    name: Migration order
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Migrations follow main's
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            git fetch --no-tags origin main
            node server/scripts/check-migrations.mjs origin/main "$HEAD_SHA"
          elif [[ ! $BEFORE =~ ^0*$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node server/scripts/check-migrations.mjs "$BEFORE" "$HEAD_SHA"
          else
            echo "This push has no earlier commit to compare with."
          fi

  check:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yourspace
          POSTGRES_PASSWORD: yourspace
          POSTGRES_DB: yourspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yourspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yourspace:yourspace@localhost:5432/yourspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The CLI's standalone executable runs
        run: |
          cli/scripts/executable.sh x64
          cli/dist/your-space-linux-x64 --version

  setups:
    # Public PRs check every stack layer. Private stacks check each layer when it reaches main.
    if: needs.scope.outputs.setups == 'true'
    needs: scope
    timeout-minutes: 10
    # Each setup's Compose files (deploy/modes/) must resolve on the oldest Compose the installation
    # guide supports, as well as on the runner's own. This only reads the configuration.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compose: ["2.26.0", runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: matrix.compose != 'runner'
        run: |
          mkdir -p ~/.docker/cli-plugins
          base=https://github.com/docker/compose/releases/download/v${{ matrix.compose }}
          curl -fsSL -o docker-compose-linux-x86_64 "$base/docker-compose-linux-x86_64"
          curl -fsSL -o docker-compose-linux-x86_64.sha256 "$base/docker-compose-linux-x86_64.sha256"
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -m 755 docker-compose-linux-x86_64 ~/.docker/cli-plugins/docker-compose
      - run: docker compose version
      - run: npx playwright test tests/setups.spec.ts --project chromium
        working-directory: e2e
        env:
          YS_E2E_SKIP_BUILD: "1"

  browser:
    name: Chromium owner and agent journeys
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: timeout 10m npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Local names for the synthetic workspace
        run: echo '127.0.0.1 space.localhost app.space.localhost whoami.space.localhost probe.space.localhost' | sudo tee -a /etc/hosts
      - name: Owner setup, app access and approvals
        run: npx playwright test tests/us1-create-owner.spec.ts tests/agents.spec.ts --project chromium --reporter=line
        working-directory: e2e

  contribution:
    name: Contribution checks
    if: always()
    needs: [scope, migrations, check, setups, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Required checks completed
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN_MIGRATIONS: ${{ github.event_name != 'workflow_dispatch' }}
          MIGRATIONS: ${{ needs.migrations.result }}
          RUN_CODE: ${{ needs.scope.outputs.code }}
          CODE: ${{ needs.check.result }}
          RUN_SETUPS: ${{ needs.scope.outputs.setups }}
          SETUPS: ${{ needs.setups.result }}
          RUN_BROWSER: ${{ needs.scope.outputs.browser }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$SCOPE" = success
          expect_result() {
            case "$1:$2" in
              true:success|false:skipped) return 0 ;;
              *) echo "$3 was scheduled=$1 and returned $2" >&2; return 1 ;;
            esac
          }
          expect_result "$RUN_MIGRATIONS" "$MIGRATIONS" "Migration order"
          expect_result "$RUN_CODE" "$CODE" "Workspace checks"
          expect_result "$RUN_SETUPS" "$SETUPS" "Compose setups"
          expect_result "$RUN_BROWSER" "$BROWSER" "Chromium"
