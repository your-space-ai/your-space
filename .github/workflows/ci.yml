name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yourspace
          POSTGRES_PASSWORD: yourspace
          POSTGRES_DB: yourspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yourspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yourspace:yourspace@localhost:5432/yourspace
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  setups:
    # Each setup's Compose files (deploy/modes/) must resolve on the oldest Compose the installation
    # guide supports, as well as on the runner's own. This only reads the configuration.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compose: ["2.26.0", runner]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: matrix.compose != 'runner'
        run: |
          mkdir -p ~/.docker/cli-plugins
          base=https://github.com/docker/compose/releases/download/v${{ matrix.compose }}
          curl -fsSL -o docker-compose-linux-x86_64 "$base/docker-compose-linux-x86_64"
          curl -fsSL -o docker-compose-linux-x86_64.sha256 "$base/docker-compose-linux-x86_64.sha256"
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -m 755 docker-compose-linux-x86_64 ~/.docker/cli-plugins/docker-compose
      - run: docker compose version
      - run: npx playwright test tests/setups.spec.ts --project chromium
        working-directory: e2e
        env:
          YS_E2E_SKIP_BUILD: "1"

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    # Argos authenticates the screenshot upload with GitHub's OIDC token. Pull requests from forks
    # get no OIDC token, so Argos falls back to looking up this run on GitHub (tokenless).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      # Builds both images, then runs the journeys against deploy/compose.yaml in all three browsers.
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 30
      - if: failure()
        run: docker compose -p ys-e2e --env-file e2e/stack.env -f deploy/compose.yaml -f deploy/compose.build.yaml logs --no-color
