name: Canary

# Publishes every push to main as a canary build, so it can run before a release (decision
# 2026-11-25, canary builds; docs/install/canary.md). It is not a release and replaces nothing a
# release uses: its version, from deploy/canary-version.sh, sorts after the release it follows
# and before the next one, such as 0.1.0-alpha.1.canary.20261125.42. It pushes the server, web and
# runtime images under that version, makes the CLI downloads and the Compose bundle as Release
# draft does, and installs from them on fresh Linux x64 and ARM64 runners. Only then does it
# replace its files on the one rolling `canary` prerelease, with their SHA256SUMS, and last
# channel.json, which names the build (deploy/channel-json.sh; spec 016, decision 5). Once they are
# published it points the images' `canary` tag at the build, so the images never run ahead of the
# files. It checks and deletes only its own files there, never another workflow's, such as a Mac
# canary's, and stops before changing any if the prerelease holds latest-mac.yml, which no canary
# release may carry. It never moves `latest` and publishes nothing to npm. It builds no Mac app
# itself: Mac canary (canary-macos.yml), a workflow of its own, packages the newest build once a day
# and adds its update ZIPs and canary-mac.yml to the same prerelease.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, which always finishes, so the canary is never left half replaced. A push
# while one runs waits, and a newer push replaces a build still waiting, so the next one is
# always of the newest commit. The group is per branch, so a run started by hand from another
# branch, which builds nothing, never replaces a build of main that is waiting.
concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'your-space-ai/your-space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          # Only main publishes. The job's condition compares without regard to case; this doesn't.
          test "$GITHUB_REF" = refs/heads/main
          # The release this commit follows: the nearest version tag in its history.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          version=$(deploy/canary-version.sh "$tag" "$(date -u +%Y%m%d)" "$BUILD")
          echo "Canary build $version of $GITHUB_SHA, after $tag." >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Canary's channel.json, for the publish job to upload last, checked before any build.
          channel=$(deploy/channel-json.sh canary "$version" "$GITHUB_SHA")
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.version }}

  cli:
    needs: version
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}

  install-test:
    needs: [version, images, cli]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-install-test.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Safe to re-run when it fails: each step looks at what the last attempt left and finishes it.
  # A run that fails between deleting SHA256SUMS and channel.json and uploading them again leaves
  # the prerelease without them, so installs and upgrades that read them stop with nothing changed
  # until Re-run failed jobs finishes the run.
  publish:
    needs: [version, install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL_JSON: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-cli
          path: release
      - name: Check the download set and write its SHA256SUMS and channel.json
        working-directory: release
        run: |
          files=(your-space.tar.gz "your-space-ai-cli-$VERSION.tgz" your-space-linux-x64 your-space-linux-arm64 your-space-linux-licenses.txt)
          test "$(find . -type f | wc -l)" -eq "${#files[@]}"
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '%s\n' "$CHANNEL_JSON" > channel.json
          jq -e --arg v "$VERSION" --arg c "$GITHUB_SHA" '. == {channel: "canary", version: $v, commit: $c}' channel.json > /dev/null
      - name: Replace the canary prerelease's files with this build's
        id: publish
        working-directory: release
        run: |
          set -o pipefail
          api="repos/$GITHUB_REPOSITORY"
          files=(your-space.tar.gz "your-space-ai-cli-$VERSION.tgz" your-space-linux-x64 your-space-linux-arm64 your-space-linux-licenses.txt)
          title="Canary $VERSION (not a release)"
          notes="An unreleased build of main ($GITHUB_SHA), replaced by the next push to main. It isn't supported and may not upgrade cleanly. To install Your Space, use a numbered release as the installation guide says. To try this build on a test installation, see Run the canary build: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install/canary.md"

          # GitHub's API fails now and then for a moment, as an HTTP 500 did when the first canary's
          # release was created. retry runs a command again while GitHub answers with a server error
          # or can't be reached: five attempts, 10 to 80 seconds apart. A refusal (HTTP 4xx) fails at
          # once, except one because a name is already taken: a call that failed may still have made
          # its release or file, and the next attempt looks first. Only the attempt that worked writes
          # to stdout. Every command it runs is safe to run twice: each function below looks at what
          # is there before it changes anything.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err"; then
                cat "$RUNNER_TEMP/err" >&2
                cat "$RUNNER_TEMP/out"
                return 0
              fi
              cat "$RUNNER_TEMP/out" "$RUNNER_TEMP/err" >&2
              if ((attempt == 5)); then return 1; fi
              if grep -Eq 'HTTP 4[0-9]{2}' "$RUNNER_TEMP/err" && ! grep -Eq 'already.exists' "$RUNNER_TEMP/out" "$RUNNER_TEMP/err"; then return 1; fi
              echo "::warning::Attempt $attempt of 5 failed ($(tail -n 1 "$RUNNER_TEMP/err")); trying again in $((10 << (attempt - 1))) seconds." >&2
              sleep $((10 << (attempt - 1)))
            done
          }

          # A build that started earlier but finished later, such as a re-run, never replaces a newer
          # one: the newest the published prerelease names, by its title, which a build sets before it
          # changes any file, so it names the newest build that has started replacing them, or by an
          # npm package. Only the published prerelease counts: a draft is what an attempt left. Only
          # the build number, the version's last part, is read, as digits: a title is free text, and
          # bash would run anything else in it as arithmetic.
          retry gh api --paginate "$api/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "canary" and (.draft | not)) | .name, .assets[].name' > "$RUNNER_TEMP/held"
          newest=0
          while read -r held; do
            if ((held > newest)); then newest=$held; fi
          done < <(sed -n -e 's/^Canary .*\.\([1-9][0-9]*\) (not a release)$/\1/p' -e 's/^your-space-ai-cli-.*\.\([1-9][0-9]*\)\.tgz$/\1/p' "$RUNNER_TEMP/held")
          if ((newest > ${VERSION##*.})); then
            echo "The canary prerelease already holds build $newest, a later one than $VERSION: nothing is replaced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No canary release may carry latest-mac.yml, the file an Alpha Mac app reads (spec 016, the
          # guard). This workflow never uploads one, and deletes only its own files, so if the canary
          # prerelease, or a draft an attempt left, holds one, it stops before changing anything, for a
          # maintainer to find where it came from.
          retry gh api --paginate "$api/releases?per_page=100" --jq '.[] | select(.tag_name == "canary") | .assets[].name' > "$RUNNER_TEMP/listed"
          if grep -qx latest-mac.yml "$RUNNER_TEMP/listed"; then
            echo "::error::The canary prerelease holds latest-mac.yml, which no canary release may carry, so nothing is replaced. Delete it, then re-run."
            exit 1
          fi

          # The canary prerelease's id. It looks before it creates, so a retry after GitHub failed but
          # made the release anyway takes that one rather than making another. A draft an attempt left
          # is published as it is, and a missing release is created with no files; this build's files
          # follow either way. GitHub makes the canary tag on this commit if there is none. No
          # make_latest: GitHub never makes a prerelease the latest release.
          options=(-F prerelease=true -f target_commitish="$GITHUB_SHA" --jq .id)
          canary_release() {
            local found
            found=$(gh api --paginate "$api/releases?per_page=100" --jq '.[] | select(.tag_name == "canary") | "\(.draft) \(.id)"') || return 1
            # The published one, if there is one, comes before any draft.
            found=$(sort <<< "$found" | sed -n 1p)
            case $found in
              false\ *) echo "${found#* }" ;;
              true\ *) gh api --method PATCH "$api/releases/${found#* }" -F draft=false "${options[@]}" ;;
              *) gh api --method POST "$api/releases" -f tag_name=canary -f name="$title" -f body="$notes" "${options[@]}" ;;
            esac
          }
          id=$(retry canary_release)
          # The title and notes name this build before any file changes, so if a step below fails, an
          # older build still finds this one recorded, even once --clobber has deleted its package.
          retry gh api --method PATCH "$api/releases/$id" -F prerelease=true -f name="$title" -f body="$notes" --silent

          # Updated in place, which notifies no one. SHA256SUMS and channel.json go before any upload
          # and come back last, so a download in between finds neither and stops, rather than mixing
          # two builds. Files no longer in the set, such as the last build's npm package, go only once
          # this build's files are there (stale), so the newest build's package stays to stop an older
          # one until then. Any file an upload left half there (not "uploaded") goes too, and is all
          # that channel.json's upload deletes (last): GitHub refuses the next upload of its name (HTTP
          # 422) until it is deleted. Each attempt deletes what a fresh listing shows, a file already
          # gone (HTTP 404) counts as deleted, and --clobber replaces this build's files that are there
          # already. Only this workflow's own files count, here and in the check below: the Linux
          # files, SHA256SUMS and channel.json. Another workflow's on the same prerelease, such as a Mac
          # canary's canary-mac.yml and your-space-macos-* ZIPs, are never deleted, even half there.
          own='your-space\.tar\.gz|your-space-ai-cli-.*\.tgz|your-space-linux-(x64|arm64|licenses\.txt)|SHA256SUMS|channel\.json'
          delete_files() {
            local asset state name
            gh api --paginate "$api/releases/$id/assets?per_page=100" --jq '.[] | "\(.id) \(.state) \(.name)"' > "$RUNNER_TEMP/listed" || return 1
            while read -r asset state name; do
              [[ $name =~ ^($own)$ ]] || continue
              if [[ $state != uploaded || ($1 != last && ($name == SHA256SUMS || $name == channel.json)) || ($1 == stale && " ${files[*]} " != *" $name "*) ]]; then
                gh api --method DELETE "$api/releases/assets/$asset" 2> "$RUNNER_TEMP/deleted" ||
                  grep -q 'HTTP 404' "$RUNNER_TEMP/deleted" || { cat "$RUNNER_TEMP/deleted" >&2; return 1; }
              fi
            done < "$RUNNER_TEMP/listed"
          }
          upload() {
            delete_files "$1" && gh release upload canary "${@:2}" --repo "$GITHUB_REPOSITORY" --clobber
          }
          retry upload keep "${files[@]}"
          retry upload stale SHA256SUMS

          # What installs read: of this workflow's files, the published prerelease holds exactly this
          # build's, and its SHA256SUMS is this build's. Only then does channel.json name the build, and
          # only once it does do the tag and the images follow.
          retry gh api "$api/releases/$id" --jq 'select(.draft | not) | .assets[] | select(.state == "uploaded") | .name' > "$RUNNER_TEMP/published"
          diff <(printf '%s\n' "${files[@]}" SHA256SUMS | sort) <(grep -Ex "$own" "$RUNNER_TEMP/published" | sort)
          retry gh release download canary --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS" --clobber
          cmp SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
          retry upload last channel.json
          retry gh release download canary --repo "$GITHUB_REPOSITORY" --pattern channel.json --output "$RUNNER_TEMP/channel.json" --clobber
          cmp channel.json "$RUNNER_TEMP/channel.json"

          # The tag follows the build, so the prerelease's source code is this commit. GitHub may refuse
          # to move a tag for a workflow's token; the files are what installs read, so that only warns.
          if ! retry gh api --method PATCH "$api/git/refs/tags/canary" -f sha="$GITHUB_SHA" -F force=true --silent; then
            echo "::warning::The canary tag stays where it was; the prerelease's files and notes are this build's, of $GITHUB_SHA."
          fi
          echo "replaced=true" >> "$GITHUB_OUTPUT"
      - if: steps.publish.outputs.replaced == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.publish.outputs.replaced == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Last, once the prerelease holds this build's files, so a build that fails before this never
      # leaves the images ahead of them. Tagging again is harmless, so a moment's GHCR failure is retried.
      - name: Point the images' canary tag at this build
        if: steps.publish.outputs.replaced == 'true'
        run: |
          for name in your-space-server your-space-web your-space-runtime; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/$name"
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$image:canary" "$image:$VERSION"; then break; fi
              if ((attempt == 5)); then exit 1; fi
              echo "::warning::Attempt $attempt of 5 to tag $image:canary failed; trying again in $((10 << (attempt - 1))) seconds."
              sleep $((10 << (attempt - 1)))
            done
          done
