name: Release publish

# Step 5 of the release guide (docs/maintainers/releasing.md). Runs when the owner publishes a
# reviewed draft. It first installs from the published release as a stranger would, with no
# credentials; nothing else runs unless that passes. Then it publishes the exact npm tarball attached to the release, after checking it
# against the release's SHA256SUMS, and points the images' `latest` tag at the release's version
# (prereleases go to npm's `next` tag and leave `latest` alone). A published npm version can never
# be reused, which is why this happens only on publication, never at draft time.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # What someone without access gets: the release's public download links and anonymous image pulls
  # on a fresh runner, with no GHCR sign-in and no token. No checkout either, as it would use one.
  stranger:
    name: Install from the public release (${{ matrix.arch }})
    if: github.repository == 'your-space-ai/your-space'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ github.event.release.tag_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The runner's own engine is older than the CLI's minimum.
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.10.0
          github-token: ''
      - name: Download every release file and check it against SHA256SUMS
        run: |
          set -o pipefail
          mkdir release
          cd release
          get() {
            curl --fail --location --silent --show-error --retry 3 --proto '=https' \
              -o "$1" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$1"
          }
          get SHA256SUMS
          # SHA256SUMS lists exactly the release's other files.
          diff <(jq -r '.release.assets[].name | select(. != "SHA256SUMS")' "$GITHUB_EVENT_PATH" | sort) \
            <(awk '{ print $2 }' SHA256SUMS | sort)
          while read -r file; do get "$file"; done < <(awk '{ print $2 }' SHA256SUMS)
          sha256sum -c SHA256SUMS
      - name: Read the images for both platforms without signing in
        run: |
          set -o pipefail
          for name in your-space-server your-space-web your-space-runtime; do
            image="ghcr.io/$GITHUB_REPOSITORY_OWNER/$name:${TAG#v}"
            if ! manifest=$(docker manifest inspect "$image"); then
              echo "::error::$image can't be pulled without signing in. Make the your-space-server, your-space-web and your-space-runtime packages on GHCR public (each package's settings, Change visibility), as step 3 of docs/maintainers/releasing.md says, then re-run the failed jobs; npm publishes once this check passes."
              exit 1
            fi
            platforms=$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ")' <<< "$manifest")
            for platform in linux/amd64 linux/arm64; do
              [[ " $platforms " == *" $platform "* ]] || { echo "::error::$image has no $platform image."; exit 1; }
            done
          done
      - name: Set up a workspace with the release's executable, as the install guide does
        run: |
          set -o pipefail
          exe="release/your-space-linux-$ARCH"
          chmod +x "$exe"
          test "$("$exe" --version)" = "${TAG#v}"
          # No --release-dir: the CLI downloads the Compose bundle from the release and pulls the images.
          "$exe" setup --workdir "$RUNNER_TEMP/workspace" --port 8081 --json |
            jq -e 'if .ok then .running and .owner == "created" else error(.error + ": " + .message) end'
          "$exe" status --workdir "$RUNNER_TEMP/workspace" --require-running --json | jq -e '.ok'

  npm:
    needs: stranger
    if: github.repository == 'your-space-ai/your-space'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # npm trusted publishing: npm exchanges this job's GitHub OIDC token (id-token: write) for a
    # short-lived publish credential. The @your-space-ai/cli package trusts only this workflow file
    # in this repository, so no npm token is stored anywhere.
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Publish the release's npm package
        run: |
          set -o pipefail
          version=${TAG#v}
          file="your-space-ai-cli-$version.tgz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --pattern SHA256SUMS
          awk -v name="$file" '$2 == name { print }' SHA256SUMS | sha256sum -c -
          test "$(tar -xOzf "$file" package/package.json | jq -r .version)" = "$version"
          if [[ $PRERELEASE == true ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish "./$file" --provenance --access public --tag "$dist_tag"

  images:
    needs: stranger
    if: github.repository == 'your-space-ai/your-space' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the published version
        run: |
          for name in your-space-server your-space-web your-space-runtime; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/$name"
            docker buildx imagetools create --tag "$image:latest" "$image:${TAG#v}"
          done
