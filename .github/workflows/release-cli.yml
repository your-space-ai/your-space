name: Release CLI

# Builds the CLI downloads for one version: the npm package @your-space-ai/cli as a tarball (your-space-ai-cli-<version>.tgz), the
# standalone Linux executables for Intel/AMD and ARM, and the Compose bundle (your-space.tar.gz)
# that `your-space init` downloads. Release draft calls it with the tag's version; Release install
# test calls it on pull requests with a rehearsal version. It publishes nothing: the files go to
# the run's `release-cli` artifact, and npm receives the exact tarball only when a draft is
# published (Release publish).
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build the npm package, the Linux executables and the Compose bundle
        run: |
          set -o pipefail
          mkdir release
          deploy/release-files.sh "$VERSION" release
          npm version "$VERSION" --workspace cli --no-git-tag-version --allow-same-version
          (cd cli && node scripts/build.mjs "$VERSION")
          npm pack --workspace cli --pack-destination release
          for arch in x64 arm64; do
            cli/scripts/executable.sh "$arch"
            cp "cli/dist/your-space-linux-$arch" release/
          done
          test "$(release/your-space-linux-x64 --version)" = "$VERSION"
          # The package holds the bundle and its manifest, at the release's version.
          tar -tzf "release/your-space-ai-cli-$VERSION.tgz" | grep -x package/dist/your-space.cjs
          test "$(tar -xOzf "release/your-space-ai-cli-$VERSION.tgz" package/package.json | jq -r .version)" = "$VERSION"
          ls -l release
          test "$(find release -type f | wc -l)" -eq 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: release/
          if-no-files-found: error
          retention-days: 7
