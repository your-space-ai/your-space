name: Release images

# Builds and pushes the versioned server, web and runtime images to GHCR for Linux AMD64 and ARM64.
# Release draft calls it with the tag's version, and Canary with a canary build's. Each processor's
# image is built natively, on a GitHub-hosted runner of its own architecture, and pushed by digest;
# then one job per image joins the two under the version's tag. It never moves `latest` or `canary`:
# Release publish and Canary do that once everything else has passed.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: your-space-server
            dockerfile: server/Dockerfile
          - name: your-space-web
            dockerfile: web/Dockerfile
          - name: your-space-runtime
            dockerfile: runtime/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only for the labels, such as the image's version: the merge job tags the image.
          tags: |
            type=raw,value=${{ inputs.version }}
          flavor: latest=false
      # No tag yet: the image is pushed by its digest, and the merge job tags both processors' at once.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag ${{ matrix.name }} ${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [your-space-server, your-space-web, your-space-runtime]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both processors' images with the version
        run: |
          set -o pipefail
          sources=()
          for file in digests/*; do sources+=("$IMAGE@sha256:${file#digests/}"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw |
            jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ")')
          for platform in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $platform "* ]] || { echo "::error::$IMAGE:$VERSION has no $platform image."; exit 1; }
          done
