name: macOS desktop

on:
  pull_request:
    paths:
      - desktop/**
      - shared/appearance/**
      - web/public/themes/**
      - cli/**
      - deploy/**
      - package-lock.json
      - package.json
      - .github/workflows/macos-desktop.yml
      - .github/workflows/images.yml
  workflow_dispatch:
  # Called by Images only after that release's server images and files are available.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: Package and open (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build the ZIP preview and exercise the DMG installation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ -z $version ]]; then version=$(node -p 'require("./desktop/package.json").version'); fi
          desktop/scripts/package-macos.sh "$version" "$RUNNER_TEMP/packages"
          name="your-space-macos-${{ matrix.arch }}-$version-preview.zip"
          (cd "$RUNNER_TEMP/packages" && shasum -a 256 -c "$name.sha256")
          ditto -x -k "$RUNNER_TEMP/packages/$name" "$RUNNER_TEMP/open"
          app="$RUNNER_TEMP/open/Your Space.app"
          test "$("$app/Contents/Resources/bin/your-space" --version)" = "$version"
          mkdir -p "$RUNNER_TEMP/signing-input"
          dmg="your-space-macos-${{ matrix.arch }}-$version-candidate.dmg"
          desktop/scripts/create-dmg.sh "$app" "$RUNNER_TEMP/signing-input/$dmg"
          desktop/scripts/test-dmg-install.sh "$RUNNER_TEMP/signing-input/$dmg" "${{ matrix.arch }}"
          (cd "$RUNNER_TEMP/signing-input" && shasum -a 256 "$dmg" > "$dmg.sha256")
      - name: Offer the private ZIP preview
        if: github.event.repository.private && !inputs.release_tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - name: Transfer the tested image to the protected signing job
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signing-input-${{ matrix.arch }}
          path: ${{ runner.temp }}/signing-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  notarize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: package
    runs-on: [self-hosted, macOS, your-space-release-signing]
    environment: macos-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-signing-input-*
          path: ${{ runner.temp }}/macos-input-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
      - name: Sign, notarize, staple and assess each app and its disk image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: |
          input="$RUNNER_TEMP/macos-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$RUNNER_TEMP/macos-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for arch in arm64 x64; do
            name="your-space-macos-$arch-${RELEASE_TAG#v}-candidate.dmg"
            (cd "$input" && shasum -a 256 -c "$name.sha256")
            desktop/scripts/notarize-macos.sh "$input/$name" "$out"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-macos
          path: ${{ runner.temp }}/macos-release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - name: Clean the protected runner's artifact copies
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/macos-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                 "$RUNNER_TEMP/macos-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
