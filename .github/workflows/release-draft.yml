name: Release draft

# Step 3 of the release guide (docs/maintainers/releasing.md). Started by hand on main with an
# existing version tag on that commit, once every status and check on that commit has passed (CircleCI's
# browser and Arm jobs included). It builds every release file, installs from them on fresh
# Linux machines, signs and notarizes the Mac apps, and creates a draft GitHub release with
# SHA256SUMS. The Mac apps' update ZIPs and latest-mac.yml reach installed apps only once the owner
# publishes the release. Only the versioned images are public afterwards; npm and `latest` wait for the owner
# to publish the draft (Release publish).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this main commit (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check-tag:
    if: github.ref == 'refs/heads/main' && github.repository == 'your-space-ai/your-space'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # To read the tagged commit's statuses and check runs, and which of them are Release draft's.
      actions: read
      checks: read
      statuses: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      previous: ${{ steps.validate.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prereleases are alphas or betas: the Mac app's updater (electron-updater) offers an alpha app later
          # alphas, betas and stable releases, and a beta app later betas and stable releases, but no other kind.
          # Each is numbered, such as alpha.2, so a canary build sorts before every later release
          # (deploy/canary-version.sh).
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.(0|[1-9][0-9]*))?$ ]] ||
            { echo "::error::Use a version tag such as v0.1.0, v0.1.0-alpha.2 or v0.1.0-beta.1."; exit 1; }
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "$TAG" <<< "$releases"; then echo "This tag already has a release."; exit 1; fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The release notes list the changes since the version tag before this one, never since the
          # rolling canary prerelease (Canary).
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2> /dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Require every status and check on the tagged commit to have passed
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          # The latest status of each context (CircleCI, Argos) must be success.
          statuses=$(gh api --paginate "$repo/commits/$GITHUB_SHA/status?per_page=100" --jq '.statuses[] | [.context, .state] | @tsv')
          # Check runs, without those of any Release draft run on this commit, this one included, so a
          # run that failed doesn't block its retry, nor those of Canary, which publishes main's
          # builds on its own and may still be running on this commit, nor those of Mac canary, whose
          # scheduled runs attach to main's newest commit whichever build they package. As in
          # required checks, skipped and neutral pass.
          drafts=$(gh api --paginate "$repo/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/release-draft.yml" or .path == ".github/workflows/canary.yml" or .path == ".github/workflows/canary-macos.yml") | .check_suite_id')
          checks=$(gh api --paginate "$repo/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.check_suite.id, .name, .conclusion // .status] | @tsv')
          missing=()
          # A result that was never reported mustn't pass: main runs these, the browser tests in
          # Chromium, Firefox and WebKit.
          contexts=$(cut -f1 <<< "$statuses")
          for context in 'ci/circleci: e2e' 'ci/circleci: e2e-arm64' 'ci/circleci: check-arm64'; do
            grep -Fqx "$context" <<< "$contexts" || missing+=("$context: no status yet")
          done
          names=$(cut -f2 <<< "$checks")
          grep -Fqx 'Contribution checks' <<< "$names" || missing+=("Contribution checks: no check run yet")
          while IFS=$'\t' read -r context state; do
            if [[ -n $context && $state != success ]]; then missing+=("$context: $state"); fi
          done <<< "$statuses"
          while IFS=$'\t' read -r suite name result; do
            if [[ -z $name ]] || grep -Fqx "$suite" <<< "$drafts"; then continue; fi
            case $result in success | skipped | neutral) ;; *) missing+=("$name: $result") ;; esac
          done <<< "$checks"
          if ((${#missing[@]})); then
            printf '%s\n' "Release draft starts only when every status and check on $TAG's commit has passed." \
              "Wait for them, or fix main and tag again. Not passed:" "${missing[@]/#/- }" >&2
            summary=$(printf '%s; ' "${missing[@]}")
            echo "::error::Not every status and check on $TAG's commit has passed: ${summary%; }"
            exit 1
          fi
          echo "Every status and check on $TAG's commit has passed."

  images:
    needs: check-tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}

  cli:
    needs: check-tag
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}

  install-test:
    needs: [check-tag, images, cli]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-install-test.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}

  macos-app:
    needs: check-tag
    uses: ./.github/workflows/release-macos-app.yml
    with:
      release_tag: ${{ inputs.tag }}
    # Its signing job reads the `macos-release` environment's secrets, which a called workflow gets
    # only when its caller passes them: without this they are empty, and nothing reports it. This
    # passes all of this workflow's secrets; the environment's resolve only in the job that sets
    # `environment: macos-release`, and none reach the unsigned build it calls in turn.
    secrets: inherit

  draft:
    needs: [check-tag, install-test, macos-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.check-tag.outputs.version }}
      PREVIOUS: ${{ needs.check-tag.outputs.previous }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-cli
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-macos
          path: macos
      - name: Check the download set and create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd macos && shasum -a 256 -c -- *.dmg.sha256 *.zip.sha256)
          mv macos/*.dmg macos/*.zip macos/latest-mac.yml release/
          cd release
          files=(your-space.tar.gz "your-space-ai-cli-$VERSION.tgz" your-space-linux-x64 your-space-linux-arm64 your-space-linux-licenses.txt)
          files+=("your-space-macos-arm64-$VERSION.dmg" "your-space-macos-x64-$VERSION.dmg")
          # The Mac apps' updater reads latest-mac.yml and installs the ZIP for its architecture.
          files+=("your-space-macos-arm64-$VERSION.zip" "your-space-macos-x64-$VERSION.zip" latest-mac.yml)
          grep -Fxq "version: '$VERSION'" latest-mac.yml
          test "$(find . -type f | wc -l)" -eq "${#files[@]}"
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          options=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes)
          if [[ $VERSION == *-* ]]; then options+=(--prerelease); fi
          if [[ -n $PREVIOUS ]]; then options+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "${options[@]}" --title "Your Space $VERSION" "${files[@]}" SHA256SUMS
