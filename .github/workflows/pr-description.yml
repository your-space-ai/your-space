name: PR description

# Checks each pull request's description against the standard in AGENTS.md ("Pull Request
# Descriptions"): the four visible sections, a short visible part, and titled collapsed sections.
# It reruns when the description is edited.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Check the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-pr-description.mjs
