name: Release macOS app

# Signs and notarizes both DMGs for a release. Only Release draft calls it, which a maintainer starts
# by hand on main with a version tag; nothing here runs on pull requests, so fork code never reaches
# the signing secrets. Signing runs on a GitHub-hosted macOS runner in the protected `macos-release`
# environment, whose secrets hold the Developer ID certificate and the App Store Connect API key.
# Then, without those secrets, each notarized DMG is installed and opened on a Mac of its own
# architecture; a failure there fails the run, so no draft is created.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/macos-app-build.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  notarize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: build
    runs-on: macos-15
    environment: macos-release
    # A new team's first submissions can wait hours in Apple's review; 360 is GitHub's maximum.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-signing-input-*
          path: ${{ runner.temp }}/macos-input
          merge-multiple: true
      - name: Load the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN=$RUNNER_TEMP/release-signing.keychain-db
          CERT_FILE=$RUNNER_TEMP/release-signing.p12
          APPLE_API_KEY_PATH=$RUNNER_TEMP/release-notary-key.p8
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          # The SHA-1 of the one Developer ID Application identity imported above.
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application: / { print $2; exit }')
          [[ -n $identity ]] || { echo '::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64.'; exit 1; }
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH"
          } >> "$GITHUB_ENV"
      - name: Sign, notarize, staple and assess each app and its disk image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          input="$RUNNER_TEMP/macos-input"
          out="$RUNNER_TEMP/macos-release"
          for arch in arm64 x64; do
            name="your-space-macos-$arch-${RELEASE_TAG#v}-candidate.dmg"
            (cd "$input" && shasum -a 256 -c "$name.sha256")
            desktop/scripts/notarize-macos.sh "$input/$name" "$out"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-macos
          path: ${{ runner.temp }}/macos-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - name: Delete the temporary keychain and decoded keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/release-signing.p12" "$RUNNER_TEMP/release-notary-key.p8"
          rm -rf "$RUNNER_TEMP/macos-input" "$RUNNER_TEMP/macos-release"

  # The packaged native smoke needs the repository's npm packages, which never run next to the
  # signing keychain, so the delivered DMGs are opened here, in a job without the environment.
  verify:
    name: Install and open the notarized app (${{ matrix.arch }})
    needs: notarize
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-macos
          path: ${{ runner.temp }}/notarized
      - name: Install the DMG, pass Gatekeeper, open the stapled app and run its CLI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=${RELEASE_TAG#v}
          name="your-space-macos-$ARCH-$version.dmg"
          (cd "$RUNNER_TEMP/notarized" && shasum -a 256 -c "$name.sha256")
          desktop/scripts/test-dmg-install.sh --notarized "$RUNNER_TEMP/notarized/$name" "$ARCH" "$version"
