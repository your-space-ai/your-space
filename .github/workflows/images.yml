name: Images

# Builds and publishes the server and web images for Intel/AMD and ARM (FR-022), and attaches the
# Compose file and settings template to each release, where the installation guide downloads them.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: your-space-server
            dockerfile: server/Dockerfile
          - name: your-space-web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # Releases get their version, and full releases also `latest`. Pushes to main get `edge`.
          # Every build also gets its commit SHA.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=edge,branch=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-files:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Each release's compose.yaml runs that release's images by default. GitHub renames release
      # files that start with a dot, so the template is published as env.example.
      - run: |
          sed "s/\${YS_VERSION:-latest}/\${YS_VERSION:-${TAG#v}}/g" deploy/compose.yaml > compose.yaml
          grep -q "YS_VERSION:-${TAG#v}}" compose.yaml
          cp deploy/.env.example env.example
          gh release upload "$TAG" compose.yaml env.example --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
