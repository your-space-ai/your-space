name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this main commit (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && github.repository == 'your-space-ai/your-space'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "$TAG" <<< "$releases"; then echo "This tag already has a release."; exit 1; fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: your-space-server
            dockerfile: server/Dockerfile
          - name: your-space-web
            dockerfile: web/Dockerfile
          - name: your-space-runtime
            dockerfile: runtime/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.candidate.outputs.version }}
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  desktop:
    needs: candidate
    uses: ./.github/workflows/macos-desktop.yml
    with:
      release_tag: ${{ inputs.tag }}

  linux:
    needs: [candidate, image]
    uses: ./.github/workflows/linux-candidate.yml
    with:
      version: ${{ needs.candidate.outputs.version }}

  assemble:
    needs: [candidate, linux, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-macos
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-install-*
          merge-multiple: true
          path: release
      - name: Verify the download set and prepare the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          files=(your-space.tar.gz)
          for arch in arm64 x64; do
            files+=("your-space-linux-$arch" "your-space-macos-$arch-$VERSION.dmg" "your-space-cli-macos-$arch-$VERSION.tar.gz")
          done
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find . -type f | wc -l)" -eq 8
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          options=(--draft --verify-tag --generate-notes)
          if [[ $VERSION == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" "${options[@]}" --title "Your Space $VERSION" "${files[@]}" SHA256SUMS
