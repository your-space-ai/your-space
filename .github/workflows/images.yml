name: Images

# Builds and publishes the server and web images for Intel/AMD and ARM (FR-022), and attaches the
# install files (your-space.tar.gz) and the CLI to each release, where the installation guide and
# the CLI download them.
# It runs on a release, or when started by hand, not on every push to main: building the ARM image
# through emulation is slow, and Actions minutes are limited while the repository is private.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: your-space-server
            dockerfile: server/Dockerfile
          - name: your-space-web
            dockerfile: web/Dockerfile
          - name: your-space-runtime
            dockerfile: runtime/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # Releases get their version, and full releases also `latest`. Every build also gets its
          # commit SHA.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-files:
    # The install files and the CLI (journey 003): your-space.tar.gz, the standalone Linux
    # executables for Intel/AMD and ARM, the .deb and .rpm packages, and SHA256SUMS listing them all,
    # which the CLI checks the install files against. The npm package is published when the
    # repository has an NPM_TOKEN secret.
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install files
        run: deploy/release-files.sh "${TAG#v}" release
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: The CLI, with the release's version
        run: |
          npm version "${TAG#v}" --workspace cli --no-git-tag-version --allow-same-version
          npm run build --workspace cli
          sudo apt-get install -y rpm
          for arch in x64 arm64; do
            cli/scripts/executable.sh "$arch"
            cli/scripts/packages.sh "$arch"
            cp "cli/dist/your-space-linux-$arch" release/
          done
          cp cli/dist/*.deb cli/dist/*.rpm release/
          (cd release && sha256sum -- * > SHA256SUMS)
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: The package installs and runs
        run: |
          sudo dpkg -i release/your-space_*_amd64.deb
          test "$(your-space --version)" = "${TAG#v}"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: gh release upload "$TAG" release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - name: npm
        if: env.NPM_TOKEN != ''
        working-directory: cli
        run: npm publish --provenance --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}

  desktop:
    if: github.event_name == 'release'
    needs: release-files
    permissions:
      contents: write
    uses: ./.github/workflows/macos-desktop.yml
