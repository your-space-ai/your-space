name: Build macOS app

# Builds the Apple Silicon and Intel apps, packs each in a DMG and tests installing it, and checks the
# in-app updater's ZIP and feed made from the same app. It runs on
# pull requests that touch the desktop app or what it bundles, Release macOS app calls it with
# the release tag, and Mac canary with a canary's version. It never signs with the
# Developer ID and has no access to signing secrets. Its feeds are written in a scratch folder that no
# artifact holds: the signing jobs write the ones that ship.

on:
  pull_request:
    paths:
      - desktop/**
      - shared/appearance/**
      - cli/**
      - deploy/**
      - package-lock.json
      - package.json
      - .github/workflows/macos-app-build.yml
      - .github/workflows/release-macos-app.yml
      - .github/workflows/canary-macos.yml
  workflow_call:
    inputs:
      # Release macOS app's: the release's tag, such as v0.1.0-alpha.2.
      release_tag:
        required: false
        type: string
        default: ''
      # Mac canary's: the canary's version, of the commit it runs on.
      version:
        required: false
        type: string
        default: ''

concurrency:
  group: macos-app-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: Package and open (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build the ZIP preview and exercise the DMG installation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANARY_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ -z $version ]]; then version=$CANARY_VERSION; fi
          # Only a pull request builds package.json's version; a caller names the one it ships.
          if [[ -z $version && $GITHUB_EVENT_NAME != pull_request ]]; then
            echo '::error::Called with neither release_tag nor version, so there is no version to build.'
            exit 1
          fi
          if [[ -z $version ]]; then version=$(node -p 'require("./desktop/package.json").version'); fi
          desktop/scripts/package-macos.sh "$version" "$RUNNER_TEMP/packages"
          name="your-space-macos-${{ matrix.arch }}-$version-preview.zip"
          (cd "$RUNNER_TEMP/packages" && shasum -a 256 -c "$name.sha256")
          ditto -x -k "$RUNNER_TEMP/packages/$name" "$RUNNER_TEMP/open"
          app="$RUNNER_TEMP/open/Your Space.app"
          # The same check the release signing job runs on the Developer ID build.
          test "$(desktop/scripts/cli-version.sh "$app")" = "$version"
          mkdir -p "$RUNNER_TEMP/signing-input"
          dmg="your-space-macos-${{ matrix.arch }}-$version-candidate.dmg"
          desktop/scripts/create-dmg.sh "$app" "$RUNNER_TEMP/signing-input/$dmg"
          desktop/scripts/test-dmg-install.sh "$RUNNER_TEMP/signing-input/$dmg" "${{ matrix.arch }}" "$version"
          (cd "$RUNNER_TEMP/signing-input" && shasum -a 256 "$dmg" > "$dmg.sha256")
          # The updater's ZIP and its feed, as the signing job makes them from the notarized app: a canary's
          # canary-mac.yml, which update-feed.mjs writes only for a canary, and otherwise latest-mac.yml.
          update="your-space-macos-${{ matrix.arch }}-$version.zip"
          mkdir -p "$RUNNER_TEMP/update"
          cp "$RUNNER_TEMP/packages/$name" "$RUNNER_TEMP/update/$update"
          if [[ -n $CANARY_VERSION ]]; then
            node desktop/scripts/update-feed.mjs --channel canary "$version" "$RUNNER_TEMP/update" "${{ matrix.arch }}"
            desktop/scripts/test-update-zip.sh --feed canary-mac.yml "$RUNNER_TEMP/update/$update" "${{ matrix.arch }}" "$version"
          else
            node desktop/scripts/update-feed.mjs "$version" "$RUNNER_TEMP/update" "${{ matrix.arch }}"
            desktop/scripts/test-update-zip.sh "$RUNNER_TEMP/update/$update" "${{ matrix.arch }}" "$version"
            # The same feed under the Mac canary's name, alone beside the ZIP, so pull requests exercise
            # the --feed check that Mac canary's verify jobs run on canary-mac.yml.
            mkdir -p "$RUNNER_TEMP/update-canary"
            ln "$RUNNER_TEMP/update/$update" "$RUNNER_TEMP/update-canary/$update"
            cp "$RUNNER_TEMP/update/latest-mac.yml" "$RUNNER_TEMP/update-canary/canary-mac.yml"
            desktop/scripts/test-update-zip.sh --feed canary-mac.yml "$RUNNER_TEMP/update-canary/$update" "${{ matrix.arch }}" "$version"
          fi
      - name: Offer the private ZIP preview
        if: github.event.repository.private && !inputs.release_tag && !inputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - name: Hand the tested image to the signing job
        if: inputs.release_tag != '' || inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signing-input-${{ matrix.arch }}
          path: ${{ runner.temp }}/signing-input/
          if-no-files-found: error
          compression-level: 0
          # Long enough to re-run only the signing job after a slow notarization or a late approval.
          retention-days: 7
