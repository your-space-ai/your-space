name: Ready for review

# CircleCI's jobs stop early on a draft pull request (.circleci/config.yml), and CircleCI starts a
# pipeline only on a push. Marking a draft ready for review starts one for its branch, so the
# browser tests, the Argos screenshots and the Arm checks run then.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  circleci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          # A CircleCI personal API token, kept in the repository's Actions secrets.
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$CIRCLECI_TOKEN" ]; then
            echo "::error::CIRCLECI_TOKEN isn't set, so CircleCI can't be started. Push to the branch, or rerun its pipeline in CircleCI."
            exit 1
          fi
          curl -fsS -X POST "https://circleci.com/api/v2/project/gh/$GITHUB_REPOSITORY/pipeline" \
            -H "Circle-Token: $CIRCLECI_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg branch "$BRANCH" '{branch: $branch}')" | jq '{number, state}'
