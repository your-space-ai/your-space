  # Docker Compose 5.7.1, from docker:29-cli in the runtime image. golang.org/x/net's html parser has
  # the flaw; govulncheck on that binary finds no path to it, and Compose 5.8.0 still pins x/net 0.60.
  - id: CVE-2026-78661
    paths: [usr/local/libexec/docker/cli-plugins/docker-compose]
    statement: golang.org/x/net/html code Compose never calls (govulncheck).
    expired_at: 2027-05-23
