# Image-scan findings in Go binaries that come from upstream images, where govulncheck shows the
# vulnerable code is never reached. Trivy reports a Go binary by module version alone; govulncheck
# checks the binary's symbols. Each entry expires so it's checked again; before renewing one, run
# `govulncheck -mode=binary` on the binary from the current upstream image (container-security.yml).
vulnerabilities:
  # gosu, in the official postgres image, is built with Go 1.24.6 on purpose: its maintainers rebuild
  # only for vulnerabilities gosu can reach (https://github.com/tianon/gosu/blob/master/SECURITY.md).
  # govulncheck on gosu 1.20 from postgres:18: "Your code is affected by 0 vulnerabilities."
  - id: CVE-2025-61726
    paths: [usr/local/bin/gosu]
    statement: Go standard library code gosu never calls (govulncheck).
    expired_at: 2027-05-23
