# Behind your own proxy or Tailscale: YS_PROXY_URL=https://... in .env. The proxy provides HTTPS
# and forwards to plain HTTP on 127.0.0.1:8080 (YS_PORT moves it), or, if the proxy runs in a
# container, to http://your-space:8080 on the edge network below. Only port 8080 trusts the
# visitor address a proxy reports.
services:
  caddy:
    ports:
      - "127.0.0.1:${YS_PORT:-8080}:8080"
    environment:
      YS_SITE: http://:8080
      YS_REDIRECT_URL: ${YS_PROXY_URL}
    networks:
      default: {}
      edge:
        aliases: [your-space]

networks:
  # Named your-space_edge. A proxy in another Compose project joins it as an external network.
  # Attach only the proxy: anything on it can report a visitor address.
  edge: {}
